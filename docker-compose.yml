version: '3.8'

services:
  db:
    image: postgres:15
    container_name: crmkiu
    restart: always
    runtime: runc
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pg_data:/var/lib/postgresql/data
      #- ./dump.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - crm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: crm_backend
    restart: always
    runtime: runc
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${PORT}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      RATE_LIMIT_COUNT: ${RATE_LIMIT_COUNT}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW}
      MAX_DAILY_SENT: ${MAX_DAILY_SENT}
      DUPLICATE_DAYS: ${DUPLICATE_DAYS}
      CORS_ORIGIN: ${CORS_ORIGIN}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: crm_frontend
    runtime: runc
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - crm_network

volumes:
  pg_data:

networks:
  crm_network:
    driver: bridge